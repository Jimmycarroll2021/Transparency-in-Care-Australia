[project]
name = "transparency-in-care-australia"
version = "0.1.0"
description = "Collectors and parsers for Australian childcare regulatory data"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pdfplumber>=0.11",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["scrapers", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
